<!DOCTYPE html>
<html>

<head>
    <base href="/">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, viewport-fit=cover, initial-scale=1, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="darkreader-lock">
    <meta name="robots" content="noindex, nofollow" />
    <style>
        /* Put critical CSS here. The rest should go in stylesheets. */
        body {
            background-color: rgb(36, 36, 37);
        }
    </style>
    <link rel="preload" as="style" href="style.css">
    <link rel="apple-touch-icon" sizes="57x57" href="img/apple-icon-57x57.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="img/apple-icon-72x72.png" />
    <link rel="apple-touch-icon" sizes="114x114" href="img/apple-icon-114x114.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="img/apple-icon-144x144.png" />
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" type="text/css" href="css/st-tailwind.css">
    <link rel="stylesheet" type="text/css" href="css/login.css">
    <link rel="manifest" crossorigin="use-credentials" href="manifest.json">
    <link href="webfonts/NotoSans/stylesheet.css" rel="stylesheet">
    <link href="webfonts/NotoSansMono/stylesheet.css" rel="stylesheet">
    <!-- fontawesome webfonts-->
    <link href="css/fontawesome.min.css" rel="stylesheet">
    <link href="css/solid.min.css" rel="stylesheet">
    <link href="css/user.css" rel="stylesheet">
    <title>SillyTavern</title>
</head>

<body class="login">
    <div id="shadow_popup" style="opacity: 0;">
        <div id="dialogue_popup">
            <div id="dialogue_popup_holder">
                <div id="dialogue_popup_text">
                    <div id="userSelectBlock" class="flex-container flexFlowColumn alignItemsCenter">
                        <h2 id="logoBlock" class="flex-container">
                            <img src="img/logo.png" alt="SillyTavern" class="logo">
                            <span data-i18n="Welcome to SillyTavern">欢迎来到AI酒馆</span>
                        </h2>
                        <h3 id="normalLoginPrompt" style="display:none;" data-i18n="Select an Account">
                            选择一个账户
                        </h3>
                        <h3 id="discreetLoginPrompt" data-i18n="Sign in with User Handle">
                            使用用户句柄登录
                        </h3>
                        <div id="userListBlock" class="wide100p">
                            <div id="userList" style="display:none;" class="flex-container justifySpaceEvenly"></div>
                            <div id="handleEntryBlock" style="display:none;" class="flex-container flexFlowColumn alignItemsCenter">
                                <input id="userHandle" class="text_pole" type="text" placeholder="用户句柄(用户名)" data-i18n="[placeholder]User handle" autocomplete="username">
                            </div>
                            <div id="passwordEntryBlock" style="display:none;"
                                class="flex-container flexFlowColumn alignItemsCenter">
                                <input id="userPassword" class="text_pole" type="password" placeholder="密码" data-i18n="[placeholder]Password" autocomplete="current-password">

                                <div id="loginCaptchaBlock" style="display:none;" class="flex-container flexFlowColumn alignItemsCenter wide100p">
                                    <div id="loginSvgCaptchaRow" class="flex-container alignItemsCenter justifyCenter flexGap10 wide100p">
                                        <input id="loginCaptcha" class="text_pole" type="text" placeholder="验证码" data-i18n="[placeholder]Verification code" style="width: 50%;" autocomplete="off">
                                        <img id="loginCaptchaImage" src="" alt="Captcha" style="cursor: pointer; height: 40px; border-radius: 4px;" title="点击刷新验证码" data-i18n="[title]Click to refresh captcha">
                                    </div>
                                    <div id="loginTurnstileContainer" style="display:none;" class="turnstile-container"></div>
                                </div>

                                <a id="recoverPassword" href="#" onclick="return false;" data-i18n="Forgot password?">密码忘了?</a>
                                <a id="communityJumpLink" href="#" target="_blank" rel="noopener noreferrer" style="display:none;" data-i18n="Join Community">加入社群</a>
                                <div class="flex-container">
                                    <div id="loginButton" class="menu_button" style="white-space: nowrap;" data-i18n="Login">登录</div>
                                </div>
                                <div id="showRegisterContainer" class="flex-container" style="margin-top: 10px;">
                                    <a id="showRegister" href="#" onclick="return false;" data-i18n="Create Account">创建账户</a>
                                </div>
                            </div>

                            <div id="registerBlock" style="display:none;" class="flex-container flexFlowColumn alignItemsCenter">
                                <input id="regHandle" class="text_pole" type="text" placeholder="输入用户句柄(用户名)" data-i18n="[placeholder]Enter user handle" autocomplete="username">
                                <input id="regPassword" class="text_pole" type="password" placeholder="新密码" data-i18n="[placeholder]New password" autocomplete="new-password">
                                <input id="regPasswordConfirm" class="text_pole" type="password" placeholder="重复密码" data-i18n="[placeholder]Confirm password" autocomplete="new-password">

                                <div id="regSvgCaptchaRow" class="flex-container alignItemsCenter justifyCenter flexGap10 wide100p">
                                    <input id="regCaptcha" class="text_pole" type="text" placeholder="验证码" data-i18n="[placeholder]Verification code" style="width: 50%;" autocomplete="off">
                                    <img id="regCaptchaImage" src="" alt="Captcha" style="cursor: pointer; height: 40px; border-radius: 4px;" title="点击刷新验证码" data-i18n="[title]Click to refresh captcha">
                                </div>
                                <div id="regTurnstileContainer" style="display:none;" class="turnstile-container"></div>

                                <div class="flex-container flexGap10">
                                    <div id="registerButton" class="menu_button" style="white-space: nowrap;" data-i18n="Register">注册</div>
                                    <div id="cancelRegister" class="menu_button" style="white-space: nowrap;" data-i18n="Cancel">取消</div>
                                </div>
                            </div>

                            <div id="passwordRecoveryBlock" style="display:none;" class="flex-container flexFlowColumn alignItemsCenter">
                                <div id="recoverMessage" data-i18n="Password recovery currently requires administrator assistance. Please contact the administrator for a recovery code.">
                                    目前仅支持管理员协助恢复，请向管理员索要恢复码
                                </div>
                                <input id="recoveryCode" class="text_pole" type="text" placeholder="恢复码" data-i18n="[placeholder]Recovery code" autocomplete="one-time-code">
                                <input id="newPassword" class="text_pole" type="password" placeholder="新密码" data-i18n="[placeholder]New password" autocomplete="new-password">
                                <div class="flex-container flexGap10">
                                    <div id="sendRecovery" class="menu_button" data-i18n="Complete Recovery">完成恢复</div>
                                    <div id="cancelRecovery" class="menu_button" data-i18n="Cancel">取消</div>
                                </div>
                            </div>
                        </div>
                        <div class="neutral_warning" id="errorMessage">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="lib/jquery-3.5.1.min.js"></script>
    <script src="scripts/login.js" type="module"></script>
</body>

</html>
